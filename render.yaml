services:
  - type: web
    name: crushreply-payment-data
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_PATH
        value: /var/data/crushreply.sqlite
      - key: PUBLIC_API_URL
        value: https://crushreply-payment-data.onrender.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://kaish254.github.io
